[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redact-local"
version = "0.1.0"
description = "De-identify a folder of matter documents on this machine before an AI assistant reads them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steve Kirby" }]
keywords = ["redaction", "de-identification", "pii", "presidio", "legal", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing",
]
requires-python = ">=3.11"
dependencies = [
  "presidio-analyzer>=2.2,<2.3",
  "presidio-anonymizer>=2.2,<2.3",
  "spacy>=3.8,<3.9",
  "pymupdf>=1.24",
  "rapidocr_onnxruntime>=1.2",
  "pillow>=10",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/skirby359/redact-local"
Issues = "https://github.com/skirby359/redact-local/issues"

[project.scripts]
redact-local = "redact_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
