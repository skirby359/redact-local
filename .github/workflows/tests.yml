name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.11"
    env:
      MODEL_WHEEL: en_core_web_lg-3.8.0-py3-none-any.whl
      MODEL_URL: https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The spaCy model is ~400 MB; download it once and reuse it.
      - name: Cache spaCy model
        id: model
        uses: actions/cache@v4
        with:
          path: .model
          key: spacy-${{ env.MODEL_WHEEL }}

      - name: Download spaCy model
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .model
          curl -sSfL -o ".model/$MODEL_WHEEL" "$MODEL_URL"

      - name: System libraries (OpenCV, used by RapidOCR)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docx,test]"
          python -m pip install ".model/$MODEL_WHEEL"

      - name: Test
        run: python -m pytest -q
